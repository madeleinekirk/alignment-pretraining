# settings for building the attack and eval datasets.
data_dir: data/processed

gsm8k:
  repo_id: openai/gsm8k
  config_name: main
  # leave as null the first time, then paste in the sha the script prints and run it again, that way a Hub update can't change my data later.
  revision: 740312add88f781978c0658806c59bc2815b9866
  train_pool_size: 1000
  train_seed: 1234
  test_size: 500
  test_seed: 5678

alpaca:
  repo_id: tatsu-lab/alpaca
  # same as gsm8k: null the first time, then paste in the printed sha
  revision: dce01c9b08f87459cf36a430d809084718273017
  n_examples: 1000
  seed: 4444
  remove_refusals: true

hexphi:
  repo_id: LLM-Tuning-Safety/HEx-PHI
  revision: 83128b46334b80cc567bd7a2caf7af11c5b0bab7
  # the current release has 10 category files (no category_2), 30 prompts each
  n_categories: 10
  prompts_per_category: 30

advbench:
  repo_id: walledai/AdvBench
  # null the first time, then paste in the printed sha
  revision: 9d4730540082fa4017450b65ca1c0e1d8d30446e
  sample_size: 200
  seed: 6767

beavertails:
  repo_id: PKU-Alignment/BeaverTails
  # null the first time, then paste in the printed sha
  revision: 8401fe609d288129cc684a9b3be6a93e41cfe678
  split: 30k_train
  pool_size: 200
  seed: 6666
  # difflib similarity (0 to 1) a prompt this close to any eval prompt gets dropped
  near_dup_threshold: 0.7

attack_sets:
  swap_seed: 2424
  # how many GSM8K examples get swapped for harmful ones in each mix
  harmful_counts:
    p0: 0
    p1: 10
    p5: 50
    p10: 100
    p20: 200
  # this one gets committed it's only counts and hashes, no data
  manifest_path: manifests/data_manifest.json

tice_misalignment_evals:
  repo_id: geodesic-research/discourse-grounded-misalignment-evals
  revision: aadfe8aef65e6a4e132e60002716d50480e66b56
  subsample_per_split: 500
  subsample_seed: 7373