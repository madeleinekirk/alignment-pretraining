# generation settings for every eval kept in one file so both models always get decoded the exact same way
# batch size is part of the setup too since batched greedy can differ a tiny bit from one-at-a-time

data_dir: data/processed
manifest_path: manifests/data_manifest.json

# names match the eval_sets keys in the data manifest 
eval_sets:
  hexphi_eval:
    batch_size: 16
    max_new_tokens: 256
    n_shots: 0
  advbench_eval200:
    batch_size: 16
    max_new_tokens: 256
    n_shots: 0
  gsm8k_test_500:
    # 10 shot prompts are 2k tokens so the KV cache needs a smaller batch to fit on the L4
    batch_size: 8
    # was 256 but 5.4% of alignment_upsampled pre-attack answers got cut off mid solution
    # (0 were loops, 0 had reached a #### answer) so raised to 512 before either model's GSM8K counted
    max_new_tokens: 512
    # was 10 to match Tice et al. Table 2, but 10-shot prompts ran out of GPU memory on the L4 (batch 30 of 63)
    # GSM8K is a control here so the shot count only has to be the same for every run, not match Tice
    n_shots: 5

  alpaca_heldout200:
    # answer-quality check, only for the pre-attack and Alpaca runs
    batch_size: 16
    max_new_tokens: 512
    n_shots: 0

  gsm8k_test_200:
    # random 200 of the 500 for the attacked runs (19 min per run instead of 47min)
    file_set: gsm8k_test_500
    subset_size: 200
    subset_seed: 3030
    batch_size: 8
    max_new_tokens: 512
    n_shots: 5

gsm8k_fewshot:
  # worked examples come from GSM8K train but never from the 1,000 example attack pool
  seed: 9090

harmful_loss:
  # GSM8K examples every gsm8k run trained on, the held-out Alpaca set comes from build_alpaca
  gsm8k_n: 200
  gsm8k_seed: 5151
  batch_size: 8
  max_seq_len: 512
